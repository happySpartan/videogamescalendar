name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend
  AZURE_RESOURCE_GROUP: video-game-calendar-rg  # Your Azure resource group name
  BACKEND_CONTAINER_APP_NAME: videogame-calendar-backend  # Your backend Container App name
  FRONTEND_CONTAINER_APP_NAME: videogame-calendar-frontend  # Your frontend Container App name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Needed for Azure login with OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image tags with SHA
      - name: Extract metadata for Docker images
        id: meta
        run: |
          echo "::set-output name=backend_tag::${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}"
          echo "::set-output name=frontend_tag::${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}"
          echo "::set-output name=backend_latest_tag::${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"
          echo "::set-output name=frontend_latest_tag::${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"

      # Build and push backend Docker image
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_tag }}
            ${{ steps.meta.outputs.backend_latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push frontend Docker image
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_tag }}
            ${{ steps.meta.outputs.frontend_latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Log in to Azure
      - name: Azure login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy backend to Azure Container App
      - name: Deploy backend to Azure Container App
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update \
              --name ${{ env.BACKEND_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ steps.meta.outputs.backend_tag }} \
              --set-env-vars \
                "TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}" \
                "TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}" \
                "ADMIN_KEY=${{ secrets.ADMIN_KEY }}" \
                "CACHE_REFRESH_HOURS=168" \
                "GAMES_REFRESH_HOURS=168"

      # Deploy frontend to Azure Container App
      - name: Deploy frontend to Azure Container App
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update \
              --name ${{ env.FRONTEND_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ steps.meta.outputs.frontend_tag }} \
              --set-env-vars \
                "VITE_API_URL=${{ secrets.BACKEND_API_URL }}"

      # Verify deployments
      - name: Verify backend deployment
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "Verifying backend deployment..."
            BACKEND_STATUS=$(az containerapp show --name ${{ env.BACKEND_CONTAINER_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.latestRevisionName" -o tsv)
            echo "Backend deployment status: Latest revision is $BACKEND_STATUS"

      - name: Verify frontend deployment
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "Verifying frontend deployment..."
            FRONTEND_STATUS=$(az containerapp show --name ${{ env.FRONTEND_CONTAINER_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.latestRevisionName" -o tsv)
            echo "Frontend deployment status: Latest revision is $FRONTEND_STATUS"
