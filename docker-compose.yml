services:
  # Database
  postgres:
    image: postgres:17-alpine
    container_name: videogame-calendar-postgres
    environment:
      POSTGRES_DB: gamecalendar
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d gamecalendar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching AND the Celery broker/backend (single URL — no /0 vs /1 split)
  redis:
    image: redis:7-alpine
    container_name: videogame-calendar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Consolidated backend — ONE app image, four roles (migrate / web / worker /
  # beat). Shares a single REDIS_URL so admin-enqueued tasks hit the same
  # broker the worker consumes.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: videogame-calendar-app:latest
    container_name: videogame-calendar-app
    environment: &app_env
      - DATABASE_URL=postgresql://gameuser:gamepass@postgres:5432/gamecalendar
      - REDIS_URL=redis://redis:6379/0
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Applies schema migrations before the API/worker start. Uses the same image
  # (which now bundles alembic + alembic.ini) and runs to completion once.
  migrate:
    image: videogame-calendar-app:latest
    container_name: videogame-calendar-migrate
    environment:
      - DATABASE_URL=postgresql://gameuser:gamepass@postgres:5432/gamecalendar
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  # Celery worker — same image, different command
  worker:
    image: videogame-calendar-app:latest
    container_name: videogame-calendar-worker
    environment: *app_env
    command: celery -A app.sync.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Celery beat scheduler — same image, different command
  beat:
    image: videogame-calendar-app:latest
    container_name: videogame-calendar-beat
    environment: *app_env
    command: celery -A app.sync.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The public API URL the browser calls (baked into the JS bundle at build
        # time). Defaults to localhost:8000; set to the real API URL for deploy,
        # e.g. VITE_GAME_API_URL=https://api.calendar.example.com.
        VITE_GAME_API_URL: ${VITE_GAME_API_URL:-http://localhost:8000}
    container_name: videogame-calendar-frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
