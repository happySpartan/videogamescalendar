# Alembic configuration for the video game calendar.
# Run migrations from the repo root:
#   alembic upgrade head
# Generate a new migration (authenticated against a reachable DB):
#   alembic revision --autogenerate -m "describe change"
# The database URL can be overridden with the DATABASE_URL env var.

[alembic]
script_location = alembic
prepend_sys_path = .
# The app's sync connection URL. Migrations run against this driver.
sqlalchemy.url = postgresql://gameuser:gamepass@localhost:5432/gamecalendar

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
